name: backend-ballance
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ballance
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: ballance
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5546}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballance -d ballance"]
      interval: 5s
      timeout: 3s
      retries: 10
  localstack:
    image: localstack/localstack:4.8.1
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4567}:4566"
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
volumes:
  pgdata:
